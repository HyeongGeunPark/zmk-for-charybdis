# Shared by the dongle and both halves.

# Split runs on ESB, not BLE. Turning BLE off is not optional here: the ESB
# module cannot compile alongside it on Zephyr 4.1, because NCS replaces BLE
# crypto with its own nrf_security and that needs an NCS mbedtls fork this
# manifest does not carry. Going back to BLE means reverting the manifest too.
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y

# ESB link tuning. Channel hopping recovers from interference without
# dropping the link, so it stays on.
CONFIG_ZMK_SPLIT_ESB_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_ACK=y
CONFIG_ZMK_SPLIT_ESB_MSG_POSTFIX_CRC=y
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_RETRANSMIT_DELAY=600
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_RETRANSMIT_COUNT=3
CONFIG_ZMK_SPLIT_ESB_RF_CH_HOP=y

# Keys are worth retrying; pointer motion is not. A dropped motion packet is
# a stale coordinate, and resending it costs more than it is worth.
CONFIG_ZMK_SPLIT_ESB_RETRY_KEY_POSITION=3
CONFIG_ZMK_SPLIT_ESB_RETRY_INPUT_EVENT=0
CONFIG_ZMK_SPLIT_ESB_RETRY_BATTERY_EVENT=1
CONFIG_ZMK_SPLIT_ESB_RETRY_CMD=1

# No BLE, so a single MPSL timeslot session is enough.
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
# Works around an ACK issue that predates the NCS 3.1.0 release; both sides
# need it.
CONFIG_ESB_TX_FIFO_SIZE=1

# ESB requeues input messages internally at a high rate, and the module
# requires these floors.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_INPUT_THREAD_STACK_SIZE=4096
CONFIG_INPUT_QUEUE_MAX_MSGS=256
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_ZMK_KEYBOARD_NAME="XI-MK1_2"
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Pointing: mouse buttons everywhere, the split forwarding on the right half,
# and the listener plus processors on the dongle. The sensor driver itself is
# enabled in charybdis_right.conf.
CONFIG_ZMK_POINTING=y
CONFIG_SETTINGS=y

# Enable 32kHz crystal
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=7
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7
