    # PMW3610 driver for the Zephyr 4.1 line. Uses the pixart,pmw3610-alt
    # compatible and CONFIG_PMW3610_ALT_* so it does not collide with the
    # native Zephyr binding.
    - name: zmk-pmw3610-driver
      remote: badjeff
      revision: 44b4a76b74d293a93cec4ccb7e04cb8d29c10f93
    # ESB split transport. Present so the dependency change can be verified on
    # its own; the transport itself stays off (CONFIG_ZMK_SPLIT_ESB defaults to
    # n, and config/charybdis.conf says so explicitly) until split moves off
    # BLE. NCS is here because ESB and MPSL come from it, and it is the author's
    # fork because stock NCS 3.1 does not pass CMake config validation against
    # Zephyr 4.1.
    - name: zmk-feature-split-esb
      remote: badjeff
      revision: 314c7cbaf4a74e1add1d6ffc8249de3e29965b8c
