manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: HyeongGeunPark
      url-base: https://github.com/HyeongGeunPark
  projects:
    # Keep in step with the reusable workflow ref in
    # .github/workflows/build.yml.
    - name: zmk
      remote: zmkfirmware
      revision: 4dd95d7840eb3d5a3f59bb29fbf1ab054715ef85
      import: app/west.yml
    # PMW3610 driver for the Zephyr 4.1 line. Uses the pixart,pmw3610-alt
    # compatible and CONFIG_PMW3610_ALT_* so it does not collide with the
    # native Zephyr binding.
    # Our fork of badjeff/zmk-pmw3610-driver: upstream main 44b4a76 plus the
    # packed-xy property and its unpack device, which send a frame that moved
    # on both axes as one notification instead of two (docs/dongle.md 1.2.1).
    - name: zmk-pmw3610-driver
      remote: HyeongGeunPark
      repo-path: zmk-pmw3610-driver-alt
      revision: 101cf73e0904b25f96fbdb0017dcc6cd499d47f6
    # Runtime CPI cycling. Forked from badjeff, itself from george-norton, to
    # work on a split where the sensor is on one half and the keys that change
    # it are on the other: locality is GLOBAL and the sensor phandle optional,
    # so the behavior can be declared once for the whole keyboard.
    - name: zmk-behavior-sensor-attr-cycle
      remote: HyeongGeunPark
      revision: c786d81c0fb138b4fc9a795aac031f22639fa323

  self:
    path: config
