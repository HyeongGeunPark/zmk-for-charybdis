manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: nrfconnect
      url-base: https://github.com/nrfconnect
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: 6e2ef41e022d555b10f116e395832913f71717b3
      import: app/west.yml
    # PMW3610 driver for the Zephyr 4.1 line. Uses the pixart,pmw3610-alt
    # compatible and CONFIG_PMW3610_ALT_* so it does not collide with the
    # native Zephyr binding.
    - name: zmk-pmw3610-driver
      remote: badjeff
      revision: 44b4a76b74d293a93cec4ccb7e04cb8d29c10f93
    # ESB split transport, plus the NCS pieces ESB and MPSL come from. NCS is
    # the module author's fork because stock NCS 3.1 does not pass CMake config
    # validation against Zephyr 4.1.
    #
    # These cannot be here while BLE is on: NCS takes over BLE crypto with its
    # own nrf_security, which wants an NCS mbedtls fork that is not in this
    # manifest, and CMake generate fails. So the whole keyboard is BLE-free --
    # see CONFIG_ZMK_BLE=n in config/charybdis.conf.
    - name: zmk-feature-split-esb
      remote: badjeff
      revision: 314c7cbaf4a74e1add1d6ffc8249de3e29965b8c
    - name: sdk-nrf
      remote: badjeff
      revision: 9b3d2623fdcd9c0fd0284f860beea924568c9826
      path: nrf
    - name: nrfxlib
      remote: nrfconnect
      revision: dfadf17305d8f000eda9aa74a5b9ff1c5647a23e
      repo-path: sdk-nrfxlib
      path: nrfxlib

  self:
    path: config
