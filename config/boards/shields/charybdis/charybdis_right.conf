CONFIG_ZMK_EXT_POWER=y

# Trackball: badjeff/zmk-pmw3610-driver, pinned in config/west.yml.
# Sensor geometry (cpi, swap-xy, invert-*) lives in charybdis_right.overlay,
# and scroll/snipe layering lives in charybdis.keymap.
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610_ALT=y

# product id 0xFF on nice!nano v2. Walked down from 1000 to 300 to 100, and
# 100 is verified from a cold boot; raise it if the trackball is ever dead
# after one.
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=100

# Reporting is decoupled from sampling; the default reports on every data
# ready interrupt, which matches the 8 ms sampling the old build ran at.
# Raise this if the BLE link gets congested once the dongle work starts.
# CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12

# CONFIG_PMW3610_ALT_LOG_LEVEL_DBG=y
