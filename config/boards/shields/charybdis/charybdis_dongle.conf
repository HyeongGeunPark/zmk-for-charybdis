# The dongle is the only central: it holds the host connection, ZMK Studio,
# and all pointer processing, and neither half talks to a host directly. The
# host link can be USB or BLE -- five profiles, switchable from the Danger
# layer -- though Studio itself stays on USB.

# Repeated from config/charybdis.conf rather than relied on, since the
# listener and processors silently do not get built without pointing support.
CONFIG_ZMK_POINTING=y
CONFIG_SETTINGS=y

# Lets the host subdivide a wheel tick through HID resolution multipliers, so
# scrolling moves in smaller steps than the three lines a plain tick means.
# Until a host negotiates one the multiplier stays at its default of 15, which
# divides by one and behaves exactly as before.
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=n
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# Report the halves' battery levels through the dongle, since they no longer
# have a host connection of their own to report over.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
