# The dongle is the only central and the only thing the host sees. With BLE
# gone it is USB-only: no host profiles, no switching between machines except
# by moving the dongle.

# Repeated from config/charybdis.conf rather than relied on, since the
# listener and processors silently do not get built without pointing support.
CONFIG_ZMK_POINTING=y
CONFIG_SETTINGS=y

CONFIG_ZMK_USB=y

# Slots for the two peripherals' state. This overrides ZMK's own peripheral
# count, which would otherwise be derived from the BLE and wired transports.
CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_COUNT=2

# Required even with BLE gone, and the name is misleading. When split BLE is
# off the ESB module redefines this symbol for peripheral battery state, and
# its definition carries no default. Only the central activates it, so leaving
# it unset writes an empty value into autoconf.h, and Zephyr's generated
# configs.c turns that into ".equ CONFIG_..., " -- an assembler error with no
# hint as to which symbol caused it.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Key positions the central tracks so a lost packet can be healed. Matches the
# 56 positions in the matrix transform.
CONFIG_ZMK_SPLIT_ESB_AUTO_HEAL_KEY_POS_MAX=56

# Lets the host subdivide a wheel tick through HID resolution multipliers, so
# scrolling moves in smaller steps than the three lines a plain tick means.
# Until a host negotiates one, the multiplier stays at its default of 15, which
# divides by one and behaves exactly as before -- a host without support is no
# worse off.
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=n
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n
