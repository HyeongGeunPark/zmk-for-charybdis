# One-off diagnostic for the dongle build failing in Zephyr's generated
# configs.c with an assembler "missing expression". That file turns every
# "#define CONFIG_" in autoconf.h into a .equ, so a single symbol reaching it
# with an empty value breaks the build, and nothing in the normal build log
# says which symbol it is.
#
# Delete this file once the symbol is known.
name: Debug dongle config

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/debug-dongle-config.yml"

jobs:
  debug:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      # Checked out at the workspace root, the way the release workflow does
      # it, so config/west.yml lands where west init expects it.
      - name: Checkout
        uses: actions/checkout@v4

      - name: West init and update
        run: |
          west init -l "${GITHUB_WORKSPACE}/config"
          west update --fetch-opt=--filter=tree:0
          west zephyr-export

      - name: Build dongle, keep going on failure
        run: |
          west build -s zmk/app -d build -b "nice_nano@2.0.0//zmk" \
            -S studio-rpc-usb-uart -- \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/config" \
            -DSHIELD=charybdis_dongle || true

      # Reported as annotations rather than plain log lines: GitHub hides
      # Actions logs from anonymous readers even on a public repo, while the
      # annotations REST endpoint stays readable. One annotation per finding,
      # so no newline escaping is involved.
      - name: Report empty CONFIG defines
        run: |
          AC=build/zephyr/include/generated/zephyr/autoconf.h
          CC=build/zephyr/misc/generated/configs.c

          found=0
          while IFS= read -r line; do
            found=1
            echo "::error title=Empty define::${line}"
          done < <(grep -nE '^#define CONFIG_[A-Za-z0-9_]+[[:space:]]*$' "$AC" || true)

          while IFS= read -r line; do
            found=1
            echo "::error title=Empty configs.c arg::${line}"
          done < <(grep -nE 'GEN_ABSOLUTE_SYM_KCONFIG\([^,]+,[[:space:]]*\)' "$CC" || true)

          if [ "$found" = "0" ]; then
            echo "::error title=Nothing found::no empty CONFIG define in autoconf.h"
          fi
