# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano@2.0.0//zmk" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano@2.0.0//zmk
#     shield: reviung41
#
# artifact-name is set on every entry so the role is unmistakable in the
# merged firmware artifact, and the wrong UF2 does not end up on a board.
---
include:
  # The only central: USB HID to the host, plus Studio.
  - board: nice_nano@2.0.0//zmk
    shield: charybdis_dongle
    snippet: studio-rpc-usb-uart
    artifact-name: charybdis_dongle
  # Both halves are peripherals; the role comes from Kconfig.defconfig, which
  # no longer makes the right half central.
  - board: nice_nano@2.0.0//zmk
    shield: charybdis_left
    artifact-name: charybdis_left
  - board: nice_nano@2.0.0//zmk
    shield: charybdis_right
    artifact-name: charybdis_right
  # Diagnostic build of the right half, same as above plus USB logging, for
  # watching the trackball driver over a serial console. The driver logs every
  # CPI change, so this says whether a CPI keypress reaches the sensor at all.
  # Not for daily use; delete this entry once that question is settled.
  - board: nice_nano@2.0.0//zmk
    shield: charybdis_right
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_PMW3610_ALT_LOG_LEVEL_DBG=y
    artifact-name: charybdis_right_usblog

  # Flash this on all three boards before the first dongle firmware.
  - board: nice_nano@2.0.0//zmk
    shield: settings_reset
    artifact-name: settings_reset
