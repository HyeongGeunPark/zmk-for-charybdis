# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano@2.0.0//zmk" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano@2.0.0//zmk
#     shield: reviung41
#
# Two identical keyboard sets are built. They differ only in their ESB
# address, which is what keeps them apart on the air -- ESB has no pairing, so
# two sets sharing an address would have each dongle accepting the other's
# halves. Set A takes the address in charybdis_layout.dtsi; set B overrides it.
#
# artifact-name carries both the set and the role, because flashing a set B
# half onto a set A board leaves a half that simply never connects, with
# nothing to say why.
---
include:
  # ---- Set A ----
  - board: nice_nano@2.0.0//zmk
    shield: charybdis_dongle
    snippet: studio-rpc-usb-uart
    artifact-name: set_a-charybdis_dongle
  - board: nice_nano@2.0.0//zmk
    shield: charybdis_left
    artifact-name: set_a-charybdis_left
  - board: nice_nano@2.0.0//zmk
    shield: charybdis_right
    artifact-name: set_a-charybdis_right

  # ---- Set B ----
  # $GITHUB_WORKSPACE is expanded by the shell that runs west, and is where the
  # config is checked out as long as this repository is not a ZMK module. If it
  # ever becomes one, ZMK copies the config elsewhere and this path has to
  # follow.
  - board: nice_nano@2.0.0//zmk
    shield: charybdis_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DEXTRA_DTC_OVERLAY_FILE=$GITHUB_WORKSPACE/config/esb_set_b.overlay
    artifact-name: set_b-charybdis_dongle
  - board: nice_nano@2.0.0//zmk
    shield: charybdis_left
    cmake-args: -DEXTRA_DTC_OVERLAY_FILE=$GITHUB_WORKSPACE/config/esb_set_b.overlay
    artifact-name: set_b-charybdis_left
  - board: nice_nano@2.0.0//zmk
    shield: charybdis_right
    cmake-args: -DEXTRA_DTC_OVERLAY_FILE=$GITHUB_WORKSPACE/config/esb_set_b.overlay
    artifact-name: set_b-charybdis_right

  # Identical for both sets; flash it on any board before its first firmware.
  - board: nice_nano@2.0.0//zmk
    shield: settings_reset
    artifact-name: settings_reset
